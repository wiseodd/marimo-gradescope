name: ci
on:
  # PRs run through `pull_request`; `push` covers main only, so a PR commit runs once.
  push:
    branches: [main]
  pull_request:
# A new commit on a PR cancels the PR's older runs. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Ruff only, at the version in uv.lock: no project sync.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: echo "RUFF=$(uv export --only-group dev --no-hashes --frozen | grep '^ruff==')" >> "$GITHUB_ENV"
      - run: uvx --from "$RUFF" ruff check
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: echo "RUFF=$(uv export --only-group dev --no-hashes --frozen | grep '^ruff==')" >> "$GITHUB_ENV"
      - run: uvx --from "$RUFF" ruff format --check
  # rustfmt and clippy on each platform. `make test` and the Windows job run the Rust tests.
  # PyO3 builds against the Python on PATH, which `abi3-py313` needs at 3.13 or newer.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --frozen
      - run: make typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --frozen
      - run: make test
  # The build's self-check runs the sandbox, which must also work on an instructor's Mac. Linux
  # runs every test; macOS runs the Rust tests and the `platform` ones (tests/conftest.py).
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --frozen
      - run: make test ARGS="-m platform"
  # Students on Windows run the check panels, the export button, the selfcheck and the PDF,
  # and instructors run `init` and `edit`: the `platform` tests. The grader and `build` need
  # Linux or macOS, so their tests skip here.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --frozen
      - run: uv run cargo test --workspace -- --include-ignored
      - run: uv run pytest -q -m platform
  # The autograder graded in Gradescope's base image. MOGS_REQUIRE_CONTAINER makes a missing
  # Docker fail the job instead of skipping the tests.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOGS_REQUIRE_CONTAINER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: uv sync --frozen
      - run: uv run pytest -m docker -v
