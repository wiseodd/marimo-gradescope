name: ci
on:
  # PRs run through `pull_request`; `push` covers main only, so a PR commit runs once.
  push:
    branches: [main]
  pull_request:
# A new commit on a PR cancels the PR's older runs. Runs on main all finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# The Rust caches are saved on main only. Runs of pull requests restore them; caches of
# their own would push the total past the 10 GB limit, and GitHub would evict main's.
jobs:
  # Ruff only, at the version in uv.lock: no project sync.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: echo "RUFF=$(uv export --only-group dev --no-hashes --frozen | grep '^ruff==')" >> "$GITHUB_ENV"
      - run: uvx --from "$RUFF" ruff check
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: echo "RUFF=$(uv export --only-group dev --no-hashes --frozen | grep '^ruff==')" >> "$GITHUB_ENV"
      - run: uvx --from "$RUFF" ruff format --check
  # rustfmt and clippy on each platform. `test-rust` and the Windows job run the Rust tests.
  # PyO3 builds against the Python on PATH, which `abi3-py311` needs at 3.11 or newer.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
  # ty reads `mogs._native` from its stub, so the project is not installed and nothing compiles.
  typecheck:
    runs-on: ubuntu-latest
    env:
      UV_NO_SYNC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-project
      - run: make typecheck
  # `make test` in two jobs that run at once: pytest here, on the oldest and the newest released
  # Python mogs supports, and the Rust tests in `test-rust`. The jobs of each OS share one Rust
  # cache, which `test-rust` saves.
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: uv sync --frozen
      - run: make test-python
  # The build's self-check runs the sandbox, which must also work on an instructor's Mac. Linux
  # runs every test; macOS runs the Rust tests and the `platform` ones (tests/conftest.py).
  test-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: false
      - run: uv sync --frozen
      - run: make test-python ARGS="-m platform"
  # The sandbox tests grade with the project's Python, so `uv sync` comes first.
  test-rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --frozen
      - run: make test-rust
  # Students on Windows run the check panels, the export button, the selfcheck and the PDF,
  # and instructors run `init` and `edit`: the `platform` tests. The grader needs Linux or
  # macOS, so its tests do not run here.
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --frozen
      - run: uv run cargo test --workspace -- --include-ignored
      - run: uv run pytest -q -m platform
  # The code that reads or runs Python code, offline, on the versions between 3.11 and 3.14.
  test-between:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: uv sync --frozen
      - run: >-
          uv run pytest -q -m "not slow and not network"
          tests/test_source.py tests/test_config.py tests/test_transform.py
          tests/test_assertrewrite_guard.py tests/test_runner.py tests/test_loader.py
  # The autograder graded in Gradescope's base image. MOGS_REQUIRE_CONTAINER makes a missing
  # Docker fail the job instead of skipping the tests.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      MOGS_REQUIRE_CONTAINER: "1"
      # The e2e tests build their wheel with `uv tool run --from 'maturin[zig]...'`, which uses
      # this tool once it is installed. The zig wrappers contain the path of the tool's
      # environment, and Cargo rebuilds everything when that path changes. An installed tool
      # keeps its path from run to run, so the cached build stays valid. The Rust cache key
      # includes both versions.
      MATURIN_VERSION: "1.16.0"
      ZIGLANG_VERSION: "0.17.1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: maturin-${{ env.MATURIN_VERSION }}-ziglang-${{ env.ZIGLANG_VERSION }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: uv tool install "maturin[zig]==$MATURIN_VERSION" --with "ziglang==$ZIGLANG_VERSION"
      - run: uv sync --frozen
      - run: uv run pytest -m docker -v
