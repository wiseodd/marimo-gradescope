name: release
# A manual run builds and smoke-tests every wheel and the sdist, and publishes nothing.
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Tags look like `0.7`: the tag, padded with `.0` to three parts, must equal the version in
  # Cargo.toml, which the wheels carry. A manual run has no tag and takes the version as is.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$GITHUB_EVENT_NAME" != release ]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          padded="$TAG"
          while [ "$(printf '%s' "$padded" | tr -cd . | wc -c)" -lt 2 ]; do
            padded="$padded.0"
          done
          if [ "$padded" != "$version" ]; then
            echo "::error::Release tag $TAG does not match version $version in Cargo.toml."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # One abi3 wheel per platform serves Python 3.11 and newer. Each wheel is built on a runner
  # of its architecture, so the smoke test can run it.
  linux:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        compatibility: [manylinux_2_17, musllinux_1_2]
        include:
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-24.04-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.compatibility }}
          args: --release --out dist
      - if: startsWith(matrix.compatibility, 'manylinux')
        uses: astral-sh/setup-uv@v6
      # `mogs --version` imports nothing outside `mogs` and the standard library, so the wheel
      # installs without its dependencies.
      # The one abi3 wheel runs on the oldest and the newest Python mogs supports.
      - if: startsWith(matrix.compatibility, 'manylinux')
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for python in 3.11 3.14; do
            uv venv --python "$python" "smoke-$python"
            uv pip install --python "smoke-$python" --no-deps dist/*.whl
            test "$("smoke-$python/bin/mogs" --version)" = "mogs $VERSION"
          done
      - if: startsWith(matrix.compatibility, 'musllinux')
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for image in python:3.11-alpine python:3.14-alpine; do
            docker run --rm -v "$PWD/dist:/dist" -e VERSION "$image" sh -euc '
              pip install --quiet --root-user-action=ignore --no-deps /dist/*.whl
              test "$(mogs --version)" = "mogs $VERSION"
            '
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}-${{ matrix.compatibility }}
          path: dist

  # Both wheels are built on an arm64 runner. Only the arm64 one runs there.
  macos:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64, x86_64]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # PyO3 builds against a Python 3.11 or newer, as `abi3-py311` needs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - if: matrix.target == 'aarch64'
        uses: astral-sh/setup-uv@v6
      - if: matrix.target == 'aarch64'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for python in 3.11 3.14; do
            uv venv --python "$python" "smoke-$python"
            uv pip install --python "smoke-$python" --no-deps dist/*.whl
            test "$("smoke-$python/bin/mogs" --version)" = "mogs $VERSION"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
          - runner: windows-11-arm
            target: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      # The abi3 module links against the import library of a Python 3.11 or newer. 3.11 is
      # the first Python with a Windows arm64 build.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: astral-sh/setup-uv@v6
      - shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for python in 3.11 3.14; do
            uv venv --python "$python" "smoke-$python"
            uv pip install --python "smoke-$python" --no-deps dist/*.whl
            test "$("smoke-$python/Scripts/mogs.exe" --version | tr -d '\r')" = "mogs $VERSION"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  sdist:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  # Trusted publishing: PyPI trusts this workflow in the `pypi` environment. No token.
  publish:
    if: github.event_name == 'release'
    needs: [linux, macos, windows, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
