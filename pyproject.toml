[project]
name = "mogs"
# The version is `[workspace.package] version` in Cargo.toml.
dynamic = ["version"]
description = "Build Gradescope autograders from marimo notebooks."
readme = "README.md"
authors = [{ name = "Agustinus Kristiadi", email = "agustinus@kristia.de" }]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "marimo",
  "packaging>=24",
  "pytest",
]

[project.urls]
Documentation = "https://mogs.kristia.de"
Repository = "https://github.com/wiseodd/mogs"
Issues = "https://github.com/wiseodd/mogs/issues"

[project.scripts]
mogs = "mogs._native:main"

[build-system]
# maturin 1.9.4 sets `PYO3_BUILD_EXTENSION_MODULE`, so the module does not link libpython.
requires = ["maturin>=1.9.4,<2"]
build-backend = "maturin"

# The wheel holds the Python package and the extension module `mogs._native`, built from
# crates/mogs.
[tool.maturin]
bindings = "pyo3"
module-name = "mogs._native"
python-source = "src"
manifest-path = "crates/mogs/Cargo.toml"

[dependency-groups]
dev = [
  "pytest>=8",
  "ty>=0.0.104",
  "ruff>=0.14",
  "pypdf>=5",
  "jsonschema>=4",
]

[tool.ty.src]
include = ["src", "tests"]
# Fixtures are notebooks under test, not code to type-check.
exclude = ["tests/fixtures"]

[tool.ty.environment]
python-version = "3.13"

[tool.ruff]
line-length = 100
target-version = "py313"
# A fixture that must fail to parse.
extend-exclude = ["tests/fixtures/syntax_error.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]
# D100: not every module needs a docstring. D105, D107: dunders and `__init__` are covered
# by the class docstring. D202: the house style puts a blank line after a function's docstring.
ignore = ["D100", "D105", "D107", "D202"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"examples/**" = ["D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: runs marimo in a subprocess through `uv run --with` (network on a cold cache)",
  "network: resolves packages from PyPI through uv, or renders a PDF with Typst packages (fast with a warm cache)",
  "docker: grades in Gradescope's base image with docker or podman (deselected unless `-m` names `docker`)",
]

[tool.uv]
# Rebuild `mogs._native` when the Rust sources change.
cache-keys = [
  { file = "pyproject.toml" },
  # The package's long description.
  { file = "README.md" },
  { file = "Cargo.toml" },
  { file = "Cargo.lock" },
  { file = "rust-toolchain.toml" },
  { file = "crates/**/*.rs" },
  # The Typst template is compiled into the module.
  { file = "crates/**/*.typ" },
  # So are the notebook template of `mogs init` and Gradescope's scripts.
  { file = "crates/mogs-cli/templates/*" },
  { file = "crates/mogs-build/templates/*" },
  { file = "crates/**/Cargo.toml" },
]
# The lockfile must install on every CI platform: Linux, macOS and Windows.
required-environments = [
  "sys_platform == 'linux' and platform_machine == 'x86_64'",
  "sys_platform == 'darwin' and platform_machine == 'arm64'",
  "sys_platform == 'win32' and platform_machine == 'AMD64'",
]
