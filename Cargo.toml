[workspace]
members = ["crates/mogs", "crates/mogs-cli", "crates/mogs-grader", "crates/mogs-pdf", "crates/mogs-schema"]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/wiseodd/mogs"

# Release wheels drop the symbols, most of the extension's size. Dev builds keep them.
[profile.release]
strip = true
