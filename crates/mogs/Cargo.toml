[package]
name = "mogs"
description = "Build Gradescope autograders from marimo notebooks."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The extension module `mogs._native`, which maturin builds into the wheel.
[lib]
name = "_native"
crate-type = ["cdylib"]
# The Python tests cover the module. A Rust test binary would need libpython to run.
test = false
doctest = false

# mogs-build is empty on Windows but for the output folders a failed build removes.
[dependencies]
mogs-build = { path = "../mogs-build" }
mogs-cli = { path = "../mogs-cli" }
mogs-grader = { path = "../mogs-grader" }
mogs-pdf = { path = "../mogs-pdf" }
pyo3 = { version = "0.30", features = ["abi3-py313"] }

# `build`, `grade` and `autograde` need Linux or macOS, as the grader does.
[target.'cfg(unix)'.dependencies]
mogs-schema = { path = "../mogs-schema" }
