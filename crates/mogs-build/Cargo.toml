[package]
name = "mogs-build"
description = "`mogs build`: the autograder zip and the self-check."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Building and grading need Linux or macOS, as the grader does.
[target.'cfg(unix)'.dependencies]
crc32fast = "1"
indexmap = "2"
mogs-grader = { path = "../mogs-grader" }
mogs-schema = { path = "../mogs-schema" }
tempfile = "3"
